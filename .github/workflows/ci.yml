name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than "10.0.x": the contract drift check compares generated
  # output byte for byte, and a patch-level change in the generator would fail
  # it for reasons that have nothing to do with the change under review.
  DOTNET_VERSION: "10.0.113"
  NODE_VERSION: "22"
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  NAMESPACE: photo-gallery

jobs:
  api:
    name: API, tests, contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      - run: dotnet build Gallery.slnx -c Release

      # Testcontainers starts Postgres and SeaweedFS; the runner has Docker.
      - run: dotnet test Gallery.slnx -c Release --no-build --logger "console;verbosity=normal"

      # The build regenerates contracts/openapi.json. If the committed copy
      # differs, the frontend's generated client is describing last week's API.
      - name: Contract matches the API
        working-directory: .
        run: git diff --exit-code -- contracts/openapi.json

  web:
    name: Frontend, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # postinstall runs Orval against contracts/openapi.json, so the checkout
      # must be complete — it is.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The suite provisions its own data through the API, but it needs a
      # running stack and a working admin credential.
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          timeout 300 bash -c 'until curl -fsS localhost:3000/healthz >/dev/null \
            && curl -fsS localhost:8080/api/v1/health/ready >/dev/null \
            && curl -fsS localhost:8081/api/v1/health/ready >/dev/null; do sleep 3; done'

      - run: npx playwright test
        working-directory: frontend

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - if: always()
        run: docker compose logs --no-color --tail=200

  release:
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/gallery/api:${{ github.sha }}
            ${{ env.REGISTRY }}/gallery/api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/gallery/web:${{ github.sha }}
            ${{ env.REGISTRY }}/gallery/web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      # One-time move from the old split manifests. Helm only adopts resources
      # that carry its ownership metadata; a fresh cluster has none of these.
      - name: Adopt platform resources
        run: |
          for r in cluster.postgresql.cnpg.io/pg seaweed.seaweedfs.com/seaweed \
                   ingress/seaweed-s3-public \
                   secret/gallery-secrets secret/pg-bootstrap secret/photo-gallery-registry; do
            kubectl -n "$NAMESPACE" label "$r" app.kubernetes.io/managed-by=Helm --overwrite || true
            kubectl -n "$NAMESPACE" annotate "$r" \
              meta.helm.sh/release-name=gallery \
              meta.helm.sh/release-namespace="$NAMESPACE" --overwrite || true
          done
        env:
          NAMESPACE: ${{ env.NAMESPACE }}

      # The chart creates the app, pull, bootstrap and storage Secrets, the
      # Postgres cluster, SeaweedFS, its buckets/IAM and the issuer. The migrate
      # hook applies migrations.
      - name: Helm upgrade
        run: |
          helm upgrade --install gallery deploy/photo-gallery \
            --namespace "$NAMESPACE" --create-namespace \
            --set ingress.siteHost="$SITE_HOST" \
            --set ingress.apiHost="$API_HOST" \
            --set ingress.imageHost="$IMAGE_HOST" \
            --set image.api.repository="$REGISTRY/gallery/api" \
            --set image.web.repository="$REGISTRY/gallery/web" \
            --set-string image.api.tag="$GITHUB_SHA" \
            --set-string image.web.tag="$GITHUB_SHA" \
            --set secrets.registry.username="$REGISTRY_USER" \
            --set-string secrets.registry.password="$REGISTRY_PASSWORD" \
            --set-string secrets.postgres.password="$POSTGRES_PASSWORD" \
            --set secrets.app.admin.username="$ADMIN_USERNAME" \
            --set-string secrets.app.admin.passwordHash="$ADMIN_PASSWORD_HASH" \
            --wait --timeout 15m
        env:
          SITE_HOST: ${{ secrets.SITE_HOST }}
          API_HOST: ${{ secrets.API_HOST }}
          IMAGE_HOST: ${{ secrets.IMAGE_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

# Required repository secrets:
#   KUBECONFIG_B64        base64 of a kubeconfig with deploy rights
#   REGISTRY_HOST         e.g. registry.hatal.cc
#   REGISTRY_USER         basic-auth user for the registry
#   REGISTRY_PASSWORD
#   POSTGRES_PASSWORD     the Postgres owner password (must match an existing cluster)
#   ADMIN_USERNAME
#   ADMIN_PASSWORD_HASH   `dotnet run --no-launch-profile -v q --project backend/src/gallery/Gallery.Api -- hash-password '...'`
#   SITE_HOST / API_HOST / IMAGE_HOST
#
# Operators (cert-manager, CloudNativePG, SeaweedFS) are installed outside this
# workflow; the chart creates every CR, bucket and IAM object. The signing key
# is reused on upgrade via Helm's lookup; the database password is supplied.
