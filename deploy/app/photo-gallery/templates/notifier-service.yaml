apiVersion: v1
kind: Service
metadata:
  name: {{ include "photo-gallery.notifier.fullname" . }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  type: ClusterIP
  selector:
    {{- include "photo-gallery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
