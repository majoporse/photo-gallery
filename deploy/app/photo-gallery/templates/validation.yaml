{{/*
The chart must pass `helm lint` without deployment values, but it must refuse to
render with placeholders. values.yaml therefore defaults these to __required__;
this template turns a forgotten value into a clean failure instead of an image
pull error or an ingress for a host called __required__.

`helm lint` renders with IsInstall and IsUpgrade both false, so it checks the
chart structure without demanding deployment values. `helm template` renders as
an install and does fail here. (The schema still rejects empty or `latest` tags
in either mode.)
*/}}
{{- if or .Release.IsInstall .Release.IsUpgrade -}}
{{- $missing := list -}}
{{- if eq .Values.image.api.tag "__required__" -}}
{{- $missing = append $missing "image.api.tag" -}}
{{- end -}}
{{- if eq .Values.image.web.tag "__required__" -}}
{{- $missing = append $missing "image.web.tag" -}}
{{- end -}}
{{- if eq .Values.ingress.siteHost "__required__" -}}
{{- $missing = append $missing "ingress.siteHost" -}}
{{- end -}}
{{- if eq .Values.ingress.apiHost "__required__" -}}
{{- $missing = append $missing "ingress.apiHost" -}}
{{- end -}}
{{- if $missing -}}
{{- fail (printf "required values not set: %s" (join ", " $missing)) -}}
{{- end -}}
{{- end -}}
