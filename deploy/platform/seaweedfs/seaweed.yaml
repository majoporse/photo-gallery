apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
  namespace: photo-gallery
spec:
  image: chrislusf/seaweedfs:4.50
  volumeServerDiskCount: 1
  master:
    replicas: 1
    # Off by default. Without it every master restart mints a new TopologyId,
    # which orphans the volume's data.
    persistence:
      requests:
        storage: 1Gi
  volume:
    replicas: 1
    requests:
      storage: 100Gi
  filer:
    replicas: 1
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
  # Standalone S3 gateway: creates the Service "seaweed-s3" on 8333, which
  # also serves the embedded IAM API. Public access is limited to the
  # "/photos" path by ingress.yaml; do not expose the Service anywhere else.
  s3:
    replicas: 1
