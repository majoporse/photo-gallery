{{- /*
The app Secret: DSN, admin login and session signing key. The signing key is
generated once and read back from the existing Secret on upgrade.
*/ -}}
{{- $appSecret := lookup "v1" "Secret" .Release.Namespace .Values.secrets.app.secretName -}}
{{- $signingKey := .Values.secrets.app.signingKey -}}
{{- if not $signingKey -}}
{{- if $appSecret -}}
{{- if hasKey $appSecret.data "Auth__SigningKey" -}}
{{- $signingKey = index $appSecret.data "Auth__SigningKey" | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $signingKey -}}
{{- $signingKey = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}

{{- $connectionString := .Values.platform.postgres.connectionString -}}
{{- if not $connectionString -}}
{{- if not .Values.platform.postgres.enabled -}}
{{- fail "platform.postgres.connectionString is required when platform.postgres.enabled=false" -}}
{{- end -}}
{{- if or (eq .Values.secrets.postgres.password "__required__") (empty .Values.secrets.postgres.password) -}}
{{- fail "secrets.postgres.password is required when platform.postgres.enabled=true" -}}
{{- end -}}
{{- $connectionString = printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" (include "photo-gallery.postgres.host" .) .Values.secrets.postgres.database .Values.secrets.postgres.username .Values.secrets.postgres.password -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.app.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  ConnectionStrings__Gallery: {{ $connectionString | quote }}
  Admin__Username: {{ .Values.secrets.app.admin.username | quote }}
  Admin__PasswordHash: {{ required "secrets.app.admin.passwordHash is required" .Values.secrets.app.admin.passwordHash | quote }}
  Auth__SigningKey: {{ $signingKey | quote }}
