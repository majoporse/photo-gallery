{{- if or .Values.secrets.storage.accessKey .Values.secrets.storage.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.storage.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  accessKey: {{ required "secrets.storage.accessKey and secrets.storage.secretKey must be set together" .Values.secrets.storage.accessKey | quote }}
  secretKey: {{ required "secrets.storage.accessKey and secrets.storage.secretKey must be set together" .Values.secrets.storage.secretKey | quote }}
{{- end }}
