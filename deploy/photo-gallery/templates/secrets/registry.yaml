{{- if or .Values.secrets.registry.username .Values.secrets.registry.password }}
{{- $registryServer := first (splitList "/" .Values.image.api.repository) -}}
{{- $registryAuth := printf "%s:%s" .Values.secrets.registry.username .Values.secrets.registry.password | b64enc -}}
{{- $dockerConfig := dict "auths" (dict $registryServer (dict "username" .Values.secrets.registry.username "password" .Values.secrets.registry.password "auth" $registryAuth)) | toJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.registry.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dockerConfig | quote }}
{{- end }}
