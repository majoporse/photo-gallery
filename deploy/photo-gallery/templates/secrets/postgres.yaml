{{- if .Values.platform.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.postgres.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.secrets.postgres.username | quote }}
  password: {{ required "secrets.postgres.password is required" .Values.secrets.postgres.password | quote }}
{{- end }}
