{{- if .Values.platform.certManager.issuer.create }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.platform.certManager.issuer.name }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: certificates
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "platform.certManager.issuer.email is required when create=true" .Values.platform.certManager.issuer.email | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" .Values.platform.certManager.issuer.name }}
    solvers:
      - http01:
          ingress:
            class: traefik
{{- end }}
