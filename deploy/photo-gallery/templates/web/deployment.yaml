apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photo-gallery.web.fullname" . }}
  labels:
    {{- include "photo-gallery.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "photo-gallery.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "photo-gallery.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- if or .Values.secrets.registry.username .Values.secrets.registry.password }}
      imagePullSecrets:
        - name: {{ .Values.secrets.registry.secretName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- include "photo-gallery.affinity" (dict "root" . "component" "web") | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: API_INTERNAL_URL
              value: {{ printf "http://%s:8080" (include "photo-gallery.api.fullname" .) | quote }}
            - name: PUBLIC_API_URL
              value: {{ printf "https://%s" .Values.ingress.apiHost | quote }}
            - name: PUBLIC_SITE_URL
              value: {{ printf "https://%s" .Values.ingress.siteHost | quote }}
            - name: IMAGE_BASE_URL
              value: {{ printf "https://%s" (include "photo-gallery.imageHost" .) | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
